name: build-float-helper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/float/**'
      - '.github/workflows/build-float.yml'
  pull_request:
    paths:
      - 'desktop/float/**'
  release:
    types: [published]

jobs:
  macos:
    name: macOS universal helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build universal (arm64 + x86_64)
        run: ./scripts/build-float-macos.sh
      - name: Smoke test (list windows)
        run: |
          ./desktop/float/bin/gufa-float-macos-universal --list-windows --out /tmp/win.json
          head -c 200 /tmp/win.json
          lipo -archs desktop/float/bin/gufa-float-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: gufa-float-macos
          path: |
            desktop/float/bin/gufa-float-macos-universal
            desktop/float/古法编程悬浮层.app

  windows:
    name: Windows helper (Win32 + WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          $ver = '1.0.2903.40'
          $zip = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$ver" -OutFile $zip
          $dir = Join-Path $env:RUNNER_TEMP 'webview2'
          Expand-Archive $zip -DestinationPath $dir -Force
          "WEBVIEW2_SDK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure (CMake)
        shell: pwsh
        run: |
          if (!(Test-Path desktop/float/win/CMakeLists.txt)) { Write-Error 'desktop/float/win/CMakeLists.txt missing'; exit 1 }
          cmake -S desktop/float/win -B build-win -A x64 -DWEBVIEW2_SDK_DIR="$env:WEBVIEW2_SDK_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build-win --config Release
      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/float/bin/win-x64 | Out-Null
          $exe = Get-ChildItem -Path build-win -Recurse -Filter *.exe | Where-Object { $_.Name -notlike 'vc_redist*' } | Select-Object -First 1
          if ($exe -eq $null) { Write-Error 'built exe not found'; exit 1 }
          Copy-Item $exe.FullName desktop/float/bin/win-x64/gufa-float-win.exe -Force
          Get-Item desktop/float/bin/win-x64/gufa-float-win.exe | Select-Object Length
      - name: Smoke test (ciProbe + local HTTP page)
        shell: pwsh
        run: |
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8799','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $probe = Join-Path $env:TEMP 'gufa-win-probe.json'
          Remove-Item $probe -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8799/'; authUrl='http://127.0.0.1:8799/'; ciProbe=$true; ciProbeOut=$probe } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $process = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          $process | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 40 -and -not (Test-Path $probe); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $probe) { Get-Content $probe }
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue
          if (-not (Select-String -Path $probe -Pattern '"ok":true' -Quiet)) {
            $log = Join-Path $env:TEMP 'gufa-float-debug.log'
            if (Test-Path $log) { Write-Host '--- helper debug log ---'; Get-Content $log -Tail 80 }
            throw 'ciProbe did not report ok:true'
          }
      - name: Smoke test (window lifecycle + controlPath exit)
        shell: pwsh
        run: |
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          if (-not (Test-Path (Join-Path $www 'index.html'))) { '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8 }
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8798','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $control = Join-Path $env:TEMP 'gufa-win-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8798/'; authUrl='http://127.0.0.1:8798/'; controlPath=$control; build='ci' } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $process = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          if ($process.HasExited) { throw "helper exited before controlPath (code $($process.ExitCode))" }
          # 用 EnumWindows 数该进程的可见顶层窗口（无边框窗口没有标题，不能用 MainWindowHandle）
          $sig = @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class GufaWinProbe {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            public static int CountVisible(uint pid) {
              var list = new List<IntPtr>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid && IsWindowVisible(h)) list.Add(h); return true; }, IntPtr.Zero);
              return list.Count;
            }
          }
          '@
          Add-Type -TypeDefinition $sig -Language CSharp
          $windows = [GufaWinProbe]::CountVisible([uint32]$process.Id)
          Write-Host "visible top-level windows for helper: $windows"
          if ($windows -lt 1) { throw 'helper created no visible window' }
          Set-Content -Path $control -Value 'exit' -NoNewline
          $exited = $process.WaitForExit(15000)
          if (-not $exited) { throw 'helper did not exit after controlPath' }
          Write-Host "helper exited after controlPath, code=$($process.ExitCode)"
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue
      - name: Smoke test (follow a real target window)
        shell: pwsh
        run: |
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          if (-not (Test-Path (Join-Path $www 'index.html'))) { '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8 }
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8797','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $target = Start-Process -FilePath 'notepad.exe' -PassThru
          Start-Sleep -Seconds 2
          $control = Join-Path $env:TEMP 'gufa-win-follow-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8797/'; authUrl='http://127.0.0.1:8797/'; controlPath=$control; build='ci'; follow=@{ pid=$target.Id; title='' } } | ConvertTo-Json -Compress -Depth 5)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public static class GufaProbe {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr after, int x, int y, int cx, int cy, uint flags);
            public static IntPtr FindMain(uint pid) {
              IntPtr best = IntPtr.Zero; long bestArea = 0;
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p != pid || !IsWindowVisible(h)) return true;
                RECT r; if (!GetWindowRect(h, out r)) return true;
                long area = (long)(r.Right - r.Left) * (r.Bottom - r.Top);
                if (area > bestArea) { bestArea = area; best = h; }
                return true;
              }, IntPtr.Zero);
              return best;
            }
            public static int[] Rect(IntPtr h) { RECT r; GetWindowRect(h, out r); return new int[] { r.Left, r.Top, r.Right - r.Left, r.Bottom - r.Top }; }
            public static void SetPos(IntPtr h, int x, int y, int cx, int cy) { SetWindowPos(h, IntPtr.Zero, x, y, cx, cy, 0x0004); }
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp
          Start-Sleep -Seconds 6
          if ($helper.HasExited) { throw "follow helper exited early (code $($helper.ExitCode))" }
          $targetHwnd = [GufaProbe]::FindMain([uint32]$target.Id)
          $helperHwnd = [GufaProbe]::FindMain([uint32]$helper.Id)
          if ($targetHwnd -eq [IntPtr]::Zero) { throw 'target window not found' }
          if ($helperHwnd -eq [IntPtr]::Zero) { throw 'helper window not found' }
          $tr = [GufaProbe]::Rect($targetHwnd)
          $hr = [GufaProbe]::Rect($helperHwnd)
          Write-Host "target rect=$($tr -join ',') helper rect=$($hr -join ',')"
          $tolerance = 120
          if ([math]::Abs($tr[0] - $hr[0]) -gt $tolerance -or [math]::Abs($tr[1] - $hr[1]) -gt $tolerance) { throw "helper did not follow target position (t=$($tr -join ',') h=$($hr -join ','))" }
          if ([math]::Abs($tr[2] - $hr[2]) -gt $tolerance -or [math]::Abs($tr[3] - $hr[3]) -gt $tolerance) { throw "helper did not follow target size (t=$($tr -join ',') h=$($hr -join ','))" }
          [GufaProbe]::SetPos($targetHwnd, 180, 140, 760, 560)
          Start-Sleep -Seconds 4
          $tr2 = [GufaProbe]::Rect($targetHwnd)
          $hr2 = [GufaProbe]::Rect($helperHwnd)
          Write-Host "after move target rect=$($tr2 -join ',') helper rect=$($hr2 -join ',')"
          if ([math]::Abs($tr2[0] - $hr2[0]) -gt $tolerance -or [math]::Abs($tr2[1] - $hr2[1]) -gt $tolerance) { throw 'helper did not follow target after move' }
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'follow helper did not exit after controlPath' }
          Write-Host 'follow window tracked target and exited cleanly'
          Stop-Process -Id $target.Id -ErrorAction SilentlyContinue
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue

      - name: Smoke test (hide and restore a "DeepSeek Harness" window)
        shell: pwsh
        run: |
          # 造一个标题为 DeepSeek Harness 的假窗口，验证 helper 的隐藏/恢复逻辑（不依赖真实 DSH）
          $scriptPath = Join-Path $env:TEMP 'gufa-dummy-window.ps1'
          @'
          Add-Type -AssemblyName System.Windows.Forms
          $form = New-Object System.Windows.Forms.Form
          $form.Text = 'DeepSeek Harness'
          $form.Width = 420
          $form.Height = 300
          $form.StartPosition = 'Manual'
          $form.Left = 320
          $form.Top = 260
          [System.Windows.Forms.Application]::Run($form)
          '@ | Set-Content -Path $scriptPath -Encoding UTF8
          $dummy = Start-Process -FilePath 'powershell' -ArgumentList @('-NoProfile','-STA','-ExecutionPolicy','Bypass','-File',$scriptPath) -PassThru
          Start-Sleep -Seconds 5
          $sig = @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class GufaHideProbe {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int max);
            public static IntPtr FindByTitle(string needle, bool visibleOnly) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => {
                if (visibleOnly && !IsWindowVisible(h)) return true;
                var buffer = new StringBuilder(512);
                GetWindowText(h, buffer, buffer.Capacity);
                if (buffer.ToString().IndexOf(needle, StringComparison.OrdinalIgnoreCase) >= 0) { found = h; return false; }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp
          $dummyHwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 30; $i++) {
            $dummyHwnd = [GufaHideProbe]::FindByTitle('DeepSeek Harness', $true)
            if ($dummyHwnd -ne [IntPtr]::Zero) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($dummyHwnd -eq [IntPtr]::Zero) { throw 'visible dummy DeepSeek Harness window not found' }
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          if (-not (Test-Path (Join-Path $www 'index.html'))) { '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8 }
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8796','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $control = Join-Path $env:TEMP 'gufa-win-hide-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8796/'; authUrl='http://127.0.0.1:8796/'; controlPath=$control; build='ci' } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          $hidden = $false
          for ($i = 0; $i -lt 20; $i++) { Start-Sleep -Milliseconds 500; if (-not [GufaHideProbe]::IsWindowVisible($dummyHwnd)) { $hidden = $true; break } }
          if (-not $hidden) { throw 'helper did not hide the DeepSeek Harness window' }
          Write-Host 'helper hid the DeepSeek Harness window'
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'hide/restore helper did not exit after controlPath' }
          $restored = $false
          for ($i = 0; $i -lt 20; $i++) { Start-Sleep -Milliseconds 500; if ([GufaHideProbe]::IsWindowVisible($dummyHwnd)) { $restored = $true; break } }
          if (-not $restored) { throw 'helper did not restore the DeepSeek Harness window' }
          Write-Host 'helper restored the DeepSeek Harness window on exit'
          Stop-Process -Id $dummy.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue

      - name: Smoke test (state injection into localStorage)
        shell: pwsh
        run: |
          # 用本地页面读取 document-start 注入的 localStorage，验证「状态回传」注入链路
          $site = Join-Path $env:TEMP 'gufa-state-site'
          New-Item -ItemType Directory -Force $site | Out-Null
          $page = @'
          <html><body>state-probe
          <script>
          function report() {
            try {
              fetch('/report', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
                float: localStorage.getItem('gufa-code:float'),
                state: localStorage.getItem('gufa-code:float-state'),
                project: localStorage.getItem('gufa-code:project'),
                ui: localStorage.getItem('gufa-code:ui:v1')
              }) });
            } catch (e) {}
          }
          report(); setTimeout(report, 400); setTimeout(report, 1200);
          </script></body></html>
          '@
          Set-Content -Path (Join-Path $site 'index.html') -Value $page -Encoding UTF8
          $serverScript = Join-Path $env:TEMP 'gufa-state-server.py'
          @'
          import http.server, os
          SITE = os.environ["GUFA_SITE"]
          OUT = os.environ["GUFA_OUT"]
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = open(os.path.join(SITE, "index.html"), "rb").read()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", "0"))
                  data = self.rfile.read(n)
                  open(OUT, "wb").write(data)
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", 8794), H).serve_forever()
          '@ | Set-Content -Path $serverScript -Encoding UTF8
          $reportPath = Join-Path $env:TEMP 'gufa-state-report.json'
          Remove-Item $reportPath -ErrorAction SilentlyContinue
          $env:GUFA_SITE = $site
          $env:GUFA_OUT = $reportPath
          $serverErr = Join-Path $env:TEMP 'gufa-state-server.err.log'
          $server = Start-Process -FilePath 'python' -ArgumentList @($serverScript) -PassThru -WindowStyle Hidden -RedirectStandardError $serverErr
          Start-Sleep -Seconds 2
          if ($server.HasExited) { if (Test-Path $serverErr) { Get-Content $serverErr }; throw 'state HTTP server failed to start' }
          $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8794/' -UseBasicParsing -TimeoutSec 10
          if ($probe.StatusCode -ne 200) { throw 'state HTTP server did not serve the page' }
          $control = Join-Path $env:TEMP 'gufa-win-state-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8794/'; authUrl='http://127.0.0.1:8794/'; controlPath=$control; build='ci'; state=@{ projectRoot='/tmp/gufa-demo'; activePath='demo/a.js'; tabs=@('demo/a.js'); ui=@{ view='explorer'; chatOpen=$true }; sessionId='session-ci' } } | ConvertTo-Json -Compress -Depth 6)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 30 -and -not (Test-Path $reportPath); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $reportPath)) {
            $log = Join-Path $env:TEMP 'gufa-float-debug.log'
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw 'page did not report localStorage values'
          }
          $report = Get-Content -Raw $reportPath
          Write-Host "state report: $report"
          if ($report -notmatch '"float":"1"') { throw 'gufa-code:float not injected' }
          if ($report -notmatch 'gufa-demo') { throw 'float-state/project not injected' }
          if ($report -notmatch 'demo/a.js') { throw 'tabs missing in injected state' }
          if ($report -notmatch 'explorer') { throw 'ui state not injected' }
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'state-test helper did not exit after controlPath' }
          Write-Host 'document-start localStorage injection works (float/state/project/ui)'
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue

      - name: Smoke test (transparent composition mode + WS_EX_NOREDIRECTIONBITMAP)
        shell: pwsh
        run: |
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          if (-not (Test-Path (Join-Path $www 'index.html'))) { '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8 }
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8791','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $control = Join-Path $env:TEMP 'gufa-win-transparent-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8791/'; authUrl='http://127.0.0.1:8791/'; controlPath=$control; build='ci' } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($helper.HasExited) { throw "transparent helper exited early (code $($helper.ExitCode))" }
          $log = Join-Path $env:TEMP 'gufa-float-debug.log'
          $lines = Get-Content $log -Tail 300 -ErrorAction SilentlyContinue
          $modes = @($lines | Select-String 'transparent-mode=')
          $modes | ForEach-Object { Write-Host $_ }
          if (-not ($modes | Select-String 'transparent-mode=composition' -Quiet)) {
            Write-Host '--- helper log tail ---'
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw 'helper did not enter composition (transparent) mode'
          }
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public static class GufaExStyleProbe {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll", EntryPoint="GetWindowLongPtrW")] public static extern IntPtr GetWindowLongPtr(IntPtr hWnd, int index);
            public static IntPtr FindTop(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) { found = h; return false; }
                return true;
              }, IntPtr.Zero);
              return found;
            }
            public static long ExStyle(IntPtr h) { return (long)GetWindowLongPtr(h, -20); }
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp
          $hwnd = [GufaExStyleProbe]::FindTop([uint32]$helper.Id)
          if ($hwnd -eq [IntPtr]::Zero) { throw 'helper top-level window not found' }
          $ex = [GufaExStyleProbe]::ExStyle($hwnd)
          Write-Host ("helper GWL_EXSTYLE=0x{0:X}" -f $ex)
          if (($ex -band 0x00080000) -eq 0) { throw 'WS_EX_LAYERED missing on helper window (DComp transparency path)' }
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'transparent helper did not exit after controlPath' }
          Write-Host 'composition (transparent) window verified: WS_EX_LAYERED + transparent-mode=composition'
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue

      - name: Smoke test (opaque mode / windowed fallback)
        shell: pwsh
        run: |
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          if (-not (Test-Path (Join-Path $www 'index.html'))) { '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8 }
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8789','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $control = Join-Path $env:TEMP 'gufa-win-opaque-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8789/'; authUrl='http://127.0.0.1:8789/'; controlPath=$control; build='ci'; opaque=$true } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          if ($helper.HasExited) { throw "opaque helper exited early (code $($helper.ExitCode))" }
          $log = Join-Path $env:TEMP 'gufa-float-debug.log'
          $lines = Get-Content $log -Tail 200 -ErrorAction SilentlyContinue
          $mode = $lines | Select-String 'transparent-mode=windowed reason=payload-opaque' | Select-Object -Last 1
          if (-not $mode) { Write-Host ($lines | Select-String 'transparent-mode=' | Select-Object -Last 5); throw 'opaque payload did not force windowed mode' }
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'opaque helper did not exit after controlPath' }
          Write-Host 'opaque/windowed fallback mode verified'
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue

      - name: Smoke test (top drag-bar hit test)
        shell: pwsh
        run: |
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          if (-not (Test-Path (Join-Path $www 'index.html'))) { '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8 }
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8788','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $control = Join-Path $env:TEMP 'gufa-win-hittest-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8788/'; authUrl='http://127.0.0.1:8788/'; controlPath=$control; build='ci' } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          if ($helper.HasExited) { throw "hittest helper exited early (code $($helper.ExitCode))" }
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public static class GufaHitProbe {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr hWnd);
            [DllImport("user32.dll", EntryPoint="SendMessageW")] public static extern IntPtr SendMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            public static IntPtr FindTop(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid && IsWindowVisible(h)) { found = h; return false; } return true; }, IntPtr.Zero);
              return found;
            }
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp
          $hwnd = [GufaHitProbe]::FindTop([uint32]$helper.Id)
          if ($hwnd -eq [IntPtr]::Zero) { throw 'helper window not found' }
          $rect = New-Object GufaHitProbe+RECT
          [void][GufaHitProbe]::GetClientRect($hwnd, [ref]$rect)
          $winRect = New-Object GufaHitProbe+RECT
          [void][GufaHitProbe]::GetWindowRect($hwnd, [ref]$winRect)
          $dpi = [GufaHitProbe]::GetDpiForWindow($hwnd)
          if ($dpi -eq 0) { $dpi = 96 }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          Write-Host "client=${width}x${height} dpi=$dpi"
          # 顶部 22 DIP 是拖动条，但最上面几像素是 resize 边框（HTTOP），取 16 DIP 命中拖动条
          $topY = [int]([math]::Floor(16 * $dpi / 96.0))
          $midY = [int]([math]::Floor($height / 2))
          $midX = [int]([math]::Floor($width / 2))
          # 注意：x=10 会落在左侧 resize 边框里（返回 HTLEFT/HTTOPLEFT），拖拽条要取水平中点
          # WM_NCHITTEST 的 lParam 用屏幕坐标
          $topScreenX = $winRect.Left + $midX
          $topScreenY = $winRect.Top + $topY
          $midScreenX = $winRect.Left + $midX
          $midScreenY = $winRect.Top + $midY
          $topLp = [IntPtr](($topScreenY -shl 16) -bor $topScreenX)
          $midLp = [IntPtr](($midScreenY -shl 16) -bor $midScreenX)
          $topResult = [int][GufaHitProbe]::SendMessage($hwnd, 0x0084, [IntPtr]::Zero, $topLp)
          $midResult = [int][GufaHitProbe]::SendMessage($hwnd, 0x0084, [IntPtr]::Zero, $midLp)
          Write-Host "WM_NCHITTEST top=$topResult (expect HTCAPTION=2) middle=$midResult (expect HTCLIENT=1)"
          if ($topResult -ne 2) { throw "top drag bar is not HTCAPTION (got $topResult)" }
          if ($midResult -ne 1) { throw "client area hit test is not HTCLIENT (got $midResult)" }
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'hittest helper did not exit after controlPath' }
          Write-Host 'top drag bar hit test verified (HTCAPTION / HTCLIENT)'
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue

      - name: Smoke test (keyboard input reaches the webview)
        shell: pwsh
        run: |
          $site = Join-Path $env:TEMP 'gufa-key-site'
          New-Item -ItemType Directory -Force $site | Out-Null
          $page = @'
          <html><body>key-probe
          <script>
          window.addEventListener("keydown", function (e) {
            try { fetch("/key", { method: "POST", body: JSON.stringify({ key: e.key, code: e.code }) }); } catch (err) {}
          });
          document.title = "key-probe-ready";
          </script></body></html>
          '@
          Set-Content -Path (Join-Path $site 'index.html') -Value $page -Encoding UTF8
          $serverScript = Join-Path $env:TEMP 'gufa-key-server.py'
          @'
          import http.server, os
          SITE = os.environ["GUFA_SITE"]
          OUT = os.environ["GUFA_OUT"]
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = open(os.path.join(SITE, "index.html"), "rb").read()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", "0"))
                  data = self.rfile.read(n)
                  open(OUT, "wb").write(data)
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", 8787), H).serve_forever()
          '@ | Set-Content -Path $serverScript -Encoding UTF8
          $keyReport = Join-Path $env:TEMP 'gufa-key-report.json'
          Remove-Item $keyReport -ErrorAction SilentlyContinue
          $env:GUFA_SITE = $site
          $env:GUFA_OUT = $keyReport
          $server = Start-Process -FilePath 'python' -ArgumentList @($serverScript) -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $control = Join-Path $env:TEMP 'gufa-win-key-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8787/'; authUrl='http://127.0.0.1:8787/'; controlPath=$control; build='ci' } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($helper.HasExited) { throw "keyboard helper exited early (code $($helper.ExitCode))" }
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public static class GufaKeyProbe {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr SetFocus(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int cmd);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            public static IntPtr FindTop(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid && IsWindowVisible(h)) { found = h; return false; } return true; }, IntPtr.Zero);
              return found;
            }
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp
          $hwnd = [GufaKeyProbe]::FindTop([uint32]$helper.Id)
          if ($hwnd -eq [IntPtr]::Zero) { throw 'helper window not found' }
          [void][GufaKeyProbe]::ShowWindow($hwnd, 5)
          [void][GufaKeyProbe]::SetForegroundWindow($hwnd)
          Start-Sleep -Milliseconds 800
          [void][GufaKeyProbe]::SetFocus($hwnd)
          Start-Sleep -Milliseconds 500
          [GufaKeyProbe]::keybd_event(0x47, 0, 0, [UIntPtr]::Zero)   # 'G'
          Start-Sleep -Milliseconds 120
          [GufaKeyProbe]::keybd_event(0x47, 0, 2, [UIntPtr]::Zero)   # key up
          for ($i = 0; $i -lt 30 -and -not (Test-Path $keyReport); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $keyReport)) {
            $log = Join-Path $env:TEMP 'gufa-float-debug.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw 'webview did not receive keyboard input'
          }
          $report = Get-Content -Raw $keyReport
          Write-Host "key report: $report"
          if ($report -notmatch '"key":"[Gg]"') { throw 'keyboard event key mismatch' }
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'keyboard helper did not exit after controlPath' }
          Write-Host 'keyboard input reached the webview (composition hosting)'
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue

      - name: Smoke test (window list app enumeration - Chinese title + EnumWindows)
        shell: pwsh
        run: |
          $targetScript = Join-Path $env:TEMP 'gufa-list-target.ps1'
          @'
          Add-Type -AssemblyName System.Windows.Forms
          $form = New-Object System.Windows.Forms.Form
          $form.Text = '腾讯视频 CI 测试'
          $form.Left = 140
          $form.Top = 140
          $form.Width = 520
          $form.Height = 360
          $form.Add_Shown({ $form.Activate() })
          [System.Windows.Forms.Application]::Run($form)
          '@ | Set-Content -Path $targetScript -Encoding UTF8
          $target = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-Sta','-File',$targetScript) -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $listScript = Join-Path $env:TEMP 'gufa-window-list.ps1'
          node --input-type=module -e "import { windowsWindowListScript } from './host/window-list-script.js'; process.stdout.write(windowsWindowListScript())" | Set-Content -Path $listScript -Encoding UTF8
          $json = & pwsh -NoProfile -File $listScript
          Write-Host $json
          if ($json -notmatch '腾讯视频 CI 测试') { throw 'window list missing Chinese title (UTF-8 or EnumWindows failure)' }
          $parsed = $json | ConvertFrom-Json
          if (-not ($parsed.apps | Where-Object { $_.title -eq '腾讯视频 CI 测试' })) { throw 'window list target app missing' }
          Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'window list includes Chinese-titled top-level window (UTF-8 ok)'

      - name: Smoke test (mouse click-through reaches underlying process)
        shell: pwsh
        run: |
          $site = Join-Path $env:TEMP 'gufa-click-site'
          New-Item -ItemType Directory -Force $site | Out-Null
          '<html><body>gufa-click-probe</body></html>' | Set-Content (Join-Path $site 'index.html') -Encoding UTF8
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8792','--bind','127.0.0.1') -WorkingDirectory $site -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $clickOut = Join-Path $env:TEMP 'gufa-click-hit.txt'
          Remove-Item $clickOut -ErrorAction SilentlyContinue
          $env:GUFA_CLICK_OUT = $clickOut
          $targetScript = Join-Path $env:TEMP 'gufa-click-target.ps1'
          @'
          Add-Type -AssemblyName System.Windows.Forms
          $form = New-Object System.Windows.Forms.Form
          $form.Text = 'Gufa Click Target'
          $form.Left = 220
          $form.Top = 220
          $form.Width = 560
          $form.Height = 400
          $out = $env:GUFA_CLICK_OUT
          $form.Add_MouseClick({ param($sender, $event) Add-Content -Path $out -Value ("click {0},{1}" -f $event.X, $event.Y) })
          $form.Add_Shown({ $form.Activate() })
          [System.Windows.Forms.Application]::Run($form)
          '@ | Set-Content -Path $targetScript -Encoding UTF8
          $target = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-Sta','-File',$targetScript) -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $control = Join-Path $env:TEMP 'gufa-win-click-control.txt'
          Remove-Item $control -ErrorAction SilentlyContinue
          $log = Join-Path $env:TEMP 'gufa-float-debug.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8792/'; authUrl='http://127.0.0.1:8792/'; controlPath=$control; build='ci'; follow=@{ pid=$target.Id; title='' } } | ConvertTo-Json -Compress)
          $env:GUFA_FLOAT_PAYLOAD = $payload
          $helper = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($helper.HasExited) { throw "click helper exited early (code $($helper.ExitCode))" }
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public static class GufaClickProbe {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            public static IntPtr FindTop(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid && IsWindowVisible(h)) { found = h; return false; } return true; }, IntPtr.Zero);
              return found;
            }
          }
          "@
          Add-Type -TypeDefinition $sig -Language CSharp
          $hwnd = [GufaClickProbe]::FindTop([uint32]$helper.Id)
          if ($hwnd -eq [IntPtr]::Zero) { throw 'helper window not found' }
          $targetHwnd = [GufaClickProbe]::FindTop([uint32]$target.Id)
          if ($targetHwnd -eq [IntPtr]::Zero) { throw 'target window not found' }
          $rect = New-Object GufaClickProbe+RECT
          [void][GufaClickProbe]::GetWindowRect($targetHwnd, [ref]$rect)
          $cx = [int](($rect.Left + $rect.Right) / 2)
          $cy = [int](($rect.Top + $rect.Bottom) / 2)
          [void][GufaClickProbe]::PostMessage($hwnd, 0x0312, [IntPtr]0x4755, [IntPtr]::Zero)
          $line = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) { $line = Get-Content $log | Select-String 'click-through=1' | Select-Object -Last 1 }
            if ($line -ne $null) { break }
          }
          if ($line -eq $null) { if (Test-Path $log) { Get-Content $log -Tail 60 }; throw 'helper did not toggle click-through' }
          Write-Host "click-through log: $line"
          if ($line -notmatch 'styleTransparent=1') { throw "click-through style not applied: $line" }
          [void][GufaClickProbe]::SetForegroundWindow($targetHwnd)
          Start-Sleep -Milliseconds 600
          [void][GufaClickProbe]::SetCursorPos($cx, $cy)
          Start-Sleep -Milliseconds 200
          [GufaClickProbe]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 80
          [GufaClickProbe]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          $clicked = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $clickOut) { $clicked = $true; break }
          }
          if (-not $clicked) { if (Test-Path $log) { Get-Content $log -Tail 60 }; throw 'click did not reach underlying window' }
          Write-Host "click hit underlying window: $(Get-Content $clickOut -Raw)"
          [void][GufaClickProbe]::PostMessage($hwnd, 0x0312, [IntPtr]0x4755, [IntPtr]::Zero)
          Start-Sleep -Milliseconds 800
          Set-Content -Path $control -Value 'exit' -NoNewline
          if (-not $helper.WaitForExit(15000)) { throw 'click helper did not exit after controlPath' }
          Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue
          Write-Host 'mouse click-through verified cross-process'

      - uses: actions/upload-artifact@v4
        with:
          name: gufa-float-win-x64
          path: desktop/float/bin/win-x64/gufa-float-win.exe

  linux:
    name: Linux helper (X11 + GTK/WebKit2GTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb wmctrl xdotool
      - name: Build
        working-directory: desktop/float/linux
        run: make -j"$(nproc)"
      - name: Stage binary
        run: |
          mkdir -p desktop/float/bin/linux-x64
          cp desktop/float/linux/gufa-float-linux desktop/float/bin/linux-x64/gufa-float-linux
          file desktop/float/bin/linux-x64/gufa-float-linux
      - name: Smoke test (ciProbe + local HTTP page under Xvfb)
        run: |
          mkdir -p /tmp/gufa-probe-www
          printf '<html><body>gufa-probe</body></html>' > /tmp/gufa-probe-www/index.html
          (cd /tmp/gufa-probe-www && python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/gufa-probe-http.log 2>&1 &)
          sleep 1
          PROBE=/tmp/gufa-linux-probe.json
          rm -f "$PROBE"
          timeout 40 xvfb-run -a ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8799/\",\"authUrl\":\"http://127.0.0.1:8799/\",\"ciProbe\":true,\"ciProbeOut\":\"$PROBE\"}" || true
          for i in $(seq 1 40); do [ -s "$PROBE" ] && break; sleep 0.5; done
          cat "$PROBE" 2>/dev/null || true
          grep -q '"ok":true' "$PROBE"
      - name: Smoke test (window lifecycle + controlPath exit under Xvfb)
        run: |
          sudo apt-get install -y xvfb xdotool
          control=/tmp/gufa-linux-control.txt
          rm -f "$control"
          ( xvfb-run -a ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8799/\",\"authUrl\":\"http://127.0.0.1:8799/\",\"controlPath\":\"$control\",\"build\":\"ci\"}" >/tmp/gufa-linux-lifecycle.log 2>&1 & echo $! > /tmp/gufa-linux-lifecycle.pid )
          sleep 8
          PID=$(cat /tmp/gufa-linux-lifecycle.pid)
          if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/gufa-linux-lifecycle.log; echo 'helper exited before controlPath'; exit 1; fi
          echo "helper alive pid=$PID"
          # 检查 Xvfb 下确实创建了窗口（xdotool 可用；失败只警告，避免无 WM 环境误报）
          DISPLAY=$(grep -o 'DISPLAY=:[0-9]*' /tmp/gufa-linux-lifecycle.log | head -1 | cut -d= -f2)
          if [ -n "$DISPLAY" ]; then DISPLAY="$DISPLAY" xdotool search --name '古法编程悬浮层' 2>/dev/null || echo 'xdotool: no named window (frameless helper may not set a title)'; fi
          printf 'exit' > "$control"
          for i in $(seq 1 30); do if ! kill -0 "$PID" 2>/dev/null; then echo "helper exited after controlPath"; exit 0; fi; sleep 0.5; done
          cat /tmp/gufa-linux-lifecycle.log
          echo 'helper did not exit after controlPath'
          exit 1
      - name: Smoke test (follow a real target window under Xvfb)
        run: |
          sudo apt-get install -y xterm x11-utils openbox
          mkdir -p /tmp/gufa-probe-www
          printf '<html><body>gufa-probe</body></html>' > /tmp/gufa-probe-www/index.html
          (cd /tmp/gufa-probe-www && python3 -m http.server 8795 --bind 127.0.0.1 >/tmp/gufa-probe-http2.log 2>&1 &)
          sleep 1
          xvfb-run -a bash -c '
            set -euxo pipefail
            openbox >/tmp/gufa-openbox.log 2>&1 &
            sleep 1
            xterm -T GUFA-TARGET -geometry 90x30+120+120 >/tmp/gufa-xterm.log 2>&1 &
            XPID=$!
            sleep 2
            XWIN=$(xdotool search --pid $XPID | head -1)
            [ -n "$XWIN" ]
            control=/tmp/gufa-linux-follow-control.txt
            rm -f "$control"
            ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8795/\",\"authUrl\":\"http://127.0.0.1:8795/\",\"controlPath\":\"$control\",\"follow\":{\"pid\":$XPID,\"title\":\"\"},\"build\":\"ci\"}" >/tmp/gufa-linux-follow.log 2>&1 &
            HPID=$!
            sleep 10
            kill -0 $HPID
            echo "helper windows (all):"; for w in $(xdotool search --pid $HPID); do echo "  $w $(xdotool getwindowgeometry $w 2>/dev/null | tr "\n" " ")" ; done
            HWIN=$(xdotool search --pid $HPID --onlyvisible | head -1)
            if [ -z "$HWIN" ]; then echo "no visible helper window"; cat /tmp/gufa-linux-follow.log; exit 1; fi
            echo "helper windows (visible):"; for w in $(xdotool search --pid $HPID --onlyvisible); do echo "  $w $(xdotool getwindowgeometry $w 2>/dev/null | tr "\n" " ")" ; done
            [ -n "$HWIN" ]
            eval $(xdotool getwindowgeometry --shell $XWIN)
            tx=$X; ty=$Y; tw=$WIDTH; th=$HEIGHT
            eval $(xdotool getwindowgeometry --shell $HWIN)
            hx=$X; hy=$Y; hw=$WIDTH; hh=$HEIGHT
            echo "target=$tx,$ty,$tw,$th helper=$hx,$hy,$hw,$hh"
            [ $((tx > hx ? tx - hx : hx - tx)) -le 120 ]
            [ $((ty > hy ? ty - hy : hy - ty)) -le 120 ]
            xdotool windowmove $XWIN 260 210
            sleep 5
            eval $(xdotool getwindowgeometry --shell $XWIN)
            tx2=$X; ty2=$Y
            eval $(xdotool getwindowgeometry --shell $HWIN)
            hx2=$X; hy2=$Y
            echo "after move target=$tx2,$ty2 helper=$hx2,$hy2"
            [ $((tx2 > hx2 ? tx2 - hx2 : hx2 - tx2)) -le 120 ]
            [ $((ty2 > hy2 ? ty2 - hy2 : hy2 - ty2)) -le 120 ]
            printf exit > "$control"
            for i in $(seq 1 30); do
              if ! kill -0 $HPID 2>/dev/null; then echo "follow helper exited cleanly"; exit 0; fi
              sleep 0.5
            done
            cat /tmp/gufa-linux-follow.log
            echo "helper did not exit after controlPath"
            exit 1
          '

      - name: Smoke test (state injection into localStorage under Xvfb)
        run: |
          mkdir -p /tmp/gufa-state-site
          cat > /tmp/gufa-state-site/index.html <<'HTML'
          <html><body>state-probe
          <script>
          function report() {
            try {
              fetch('/report', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
                float: localStorage.getItem('gufa-code:float'),
                state: localStorage.getItem('gufa-code:float-state'),
                project: localStorage.getItem('gufa-code:project'),
                ui: localStorage.getItem('gufa-code:ui:v1')
              }) });
            } catch (e) {}
          }
          report(); setTimeout(report, 400); setTimeout(report, 1200);
          </script></body></html>
          HTML
          cat > /tmp/gufa-state-server.py <<'PY'
          import http.server, os
          SITE = os.environ["GUFA_SITE"]
          OUT = os.environ["GUFA_OUT"]
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = open(os.path.join(SITE, "index.html"), "rb").read()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", "0"))
                  data = self.rfile.read(n)
                  open(OUT, "wb").write(data)
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", 8793), H).serve_forever()
          PY
          rm -f /tmp/gufa-state-report.json
          GUFA_SITE=/tmp/gufa-state-site GUFA_OUT=/tmp/gufa-state-report.json python3 /tmp/gufa-state-server.py >/tmp/gufa-state-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          curl -sf http://127.0.0.1:8793/ >/dev/null
          control=/tmp/gufa-linux-state-control.txt
          rm -f "$control"
          xvfb-run -a ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8793/\",\"authUrl\":\"http://127.0.0.1:8793/\",\"controlPath\":\"$control\",\"build\":\"ci\",\"state\":{\"projectRoot\":\"/tmp/gufa-demo\",\"activePath\":\"demo/a.js\",\"tabs\":[\"demo/a.js\"],\"ui\":{\"view\":\"explorer\",\"chatOpen\":true},\"sessionId\":\"session-ci\"}}" >/tmp/gufa-linux-state.log 2>&1 &
          HPID=$!
          for i in $(seq 1 30); do [ -s /tmp/gufa-state-report.json ] && break; sleep 0.5; done
          CURRENT=$(cat /tmp/gufa-state-report.json 2>/dev/null || true)
          echo "state report: $CURRENT"
          printf exit > "$control"
          for i in $(seq 1 30); do if ! kill -0 $HPID 2>/dev/null; then break; fi; sleep 0.5; done
          kill -9 $HPID 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          echo "$CURRENT" | grep -q '"float":"1"'
          echo "$CURRENT" | grep -q 'gufa-demo'
          echo "$CURRENT" | grep -q 'demo/a.js'
          echo "$CURRENT" | grep -q 'explorer'
          echo 'document-start localStorage injection works on Linux (float/state/project/ui)'

      - name: Smoke test (hide and restore a "DeepSeek Harness" window under Xvfb)
        run: |
          mkdir -p /tmp/gufa-probe-www
          printf '<html><body>gufa-probe</body></html>' > /tmp/gufa-probe-www/index.html
          (cd /tmp/gufa-probe-www && python3 -m http.server 8792 --bind 127.0.0.1 >/tmp/gufa-hide-http.log 2>&1 &)
          sleep 1
          xvfb-run -a bash -c '
            set -euxo pipefail
            openbox >/tmp/gufa-openbox-hide.log 2>&1 &
            sleep 1
            # 用 xmessage 而不是 xterm：xterm 的标题会被 shell 的 PROMPT_COMMAND 覆盖成提示符
            xmessage -title "DeepSeek Harness" -geometry 360x240+200+160 probe >/tmp/gufa-xmessage-hide.log 2>&1 &
            XPID=$!
            sleep 2
            XWIN=$(xdotool search --name "DeepSeek Harness" | head -1)
            [ -n "$XWIN" ]
            xwininfo -id $XWIN | grep -q "IsViewable"
            control=/tmp/gufa-linux-hide-control.txt
            rm -f "$control"
            ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8792/\",\"authUrl\":\"http://127.0.0.1:8792/\",\"controlPath\":\"$control\",\"build\":\"ci\"}" >/tmp/gufa-linux-hide.log 2>&1 &
            HPID=$!
            hidden=0
            for i in $(seq 1 20); do
              if xwininfo -id $XWIN 2>/dev/null | grep -q "IsUnMapped"; then hidden=1; break; fi
              sleep 0.5
            done
            if [ $hidden -ne 1 ]; then echo "helper did not hide DeepSeek Harness window"; cat /tmp/gufa-linux-hide.log; kill -9 $HPID 2>/dev/null || true; exit 1; fi
            echo "helper hid the DeepSeek Harness window"
            printf exit > "$control"
            for i in $(seq 1 30); do if ! kill -0 $HPID 2>/dev/null; then break; fi; sleep 0.5; done
            kill -9 $HPID 2>/dev/null || true
            restored=0
            for i in $(seq 1 20); do
              if xwininfo -id $XWIN 2>/dev/null | grep -q "IsViewable"; then restored=1; break; fi
              sleep 0.5
            done
            if [ $restored -ne 1 ]; then echo "helper did not restore DeepSeek Harness window"; cat /tmp/gufa-linux-hide.log; exit 1; fi
            echo "helper restored the DeepSeek Harness window on exit"
          '

      - name: Smoke test (RGBA transparency with compositor under Xvfb)
        run: |
          sudo apt-get install -y xcompmgr
          mkdir -p /tmp/gufa-probe-www
          printf '<html><body>gufa-probe</body></html>' > /tmp/gufa-probe-www/index.html
          (cd /tmp/gufa-probe-www && python3 -m http.server 8790 --bind 127.0.0.1 >/tmp/gufa-probe-http3.log 2>&1 &)
          sleep 1
          xvfb-run -a bash -c '
            set -euxo pipefail
            openbox >/tmp/gufa-openbox-transp.log 2>&1 &
            sleep 1
            xcompmgr -a >/tmp/gufa-xcompmgr.log 2>&1 &
            sleep 1
            control=/tmp/gufa-linux-transp-control.txt
            rm -f "$control"
            ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8790/\",\"authUrl\":\"http://127.0.0.1:8790/\",\"controlPath\":\"$control\",\"build\":\"ci\"}" >/tmp/gufa-linux-transp.log 2>&1 &
            HPID=$!
            sleep 8
            kill -0 $HPID
            grep -q "使用 RGBA visual" /tmp/gufa-linux-transp.log
            HWIN=$(xdotool search --pid $HPID --onlyvisible | head -1)
            [ -n "$HWIN" ]
            echo "RGBA transparency path active (compositor detected)"
            printf exit > "$control"
            for i in $(seq 1 30); do if ! kill -0 $HPID 2>/dev/null; then echo "transparency helper exited cleanly"; exit 0; fi; sleep 0.5; done
            cat /tmp/gufa-linux-transp.log
            echo "helper did not exit after controlPath"
            exit 1
          '

      - name: Smoke test (keyboard input reaches the webview under Xvfb)
        run: |
          mkdir -p /tmp/gufa-key-site
          cat > /tmp/gufa-key-site/index.html <<'HTML'
          <html><body>key-probe
          <script>
          window.addEventListener('keydown', function (e) {
            try { fetch('/key', { method: 'POST', body: JSON.stringify({ key: e.key, code: e.code }) }); } catch (err) {}
          });
          </script></body></html>
          HTML
          cat > /tmp/gufa-key-server.py <<'PY'
          import http.server, os
          SITE = os.environ["GUFA_SITE"]
          OUT = os.environ["GUFA_OUT"]
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = open(os.path.join(SITE, "index.html"), "rb").read()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", "0"))
                  data = self.rfile.read(n)
                  open(OUT, "wb").write(data)
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", 8786), H).serve_forever()
          PY
          rm -f /tmp/gufa-key-report.json
          GUFA_SITE=/tmp/gufa-key-site GUFA_OUT=/tmp/gufa-key-report.json python3 /tmp/gufa-key-server.py >/tmp/gufa-key-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          curl -sf http://127.0.0.1:8786/ >/dev/null
          xvfb-run -a bash -c '
            set -euxo pipefail
            openbox >/tmp/gufa-openbox-key.log 2>&1 &
            sleep 1
            control=/tmp/gufa-linux-key-control.txt
            rm -f "$control"
            ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8786/\",\"authUrl\":\"http://127.0.0.1:8786/\",\"controlPath\":\"$control\",\"build\":\"ci\"}" >/tmp/gufa-linux-key.log 2>&1 &
            HPID=$!
            sleep 8
            kill -0 $HPID
            HWIN=$(xdotool search --pid $HPID --onlyvisible | head -1)
            [ -n "$HWIN" ]
            xdotool windowactivate --sync $HWIN
            sleep 1
            # 用 XTEST（全局）而不是 --window（XSendEvent 合成事件，GTK/WebKit 常忽略）
            xdotool key g
            for i in $(seq 1 20); do [ -s /tmp/gufa-key-report.json ] && break; sleep 0.5; done
            KEY=$(cat /tmp/gufa-key-report.json 2>/dev/null || true)
            echo "key report: $KEY"
            if [ -z "$KEY" ]; then echo "--- helper log ---"; tail -40 /tmp/gufa-linux-key.log; fi
            printf exit > "$control"
            for i in $(seq 1 30); do if ! kill -0 $HPID 2>/dev/null; then break; fi; sleep 0.5; done
            kill -9 $HPID 2>/dev/null || true
            echo "$KEY" | grep -Eq "\"key\":\"[Gg]\""
            echo "keyboard input reached the webview on Linux"
          '
          kill $SERVER_PID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: gufa-float-linux-x64
          path: desktop/float/bin/linux-x64/gufa-float-linux

  package-binaries:
    name: Commit helper binaries to build/float-binaries
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage binaries
        run: |
          set -e
          mkdir -p desktop/float/bin/win-x64 desktop/float/bin/linux-x64
          find artifacts -type f | head -50
          if [ -f artifacts/gufa-float-win-x64/gufa-float-win.exe ]; then
            cp artifacts/gufa-float-win-x64/gufa-float-win.exe desktop/float/bin/win-x64/gufa-float-win.exe
          fi
          if [ -f artifacts/gufa-float-linux-x64/gufa-float-linux ]; then
            cp artifacts/gufa-float-linux-x64/gufa-float-linux desktop/float/bin/linux-x64/gufa-float-linux
            chmod +x desktop/float/bin/linux-x64/gufa-float-linux
          fi
          # macOS artifact 保留了上传时的相对路径（desktop/float/...），显式搬运，避免出现 bin/bin 嵌套
          for base in artifacts/gufa-float-macos/desktop/float artifacts/gufa-float-macos; do
            [ -d "$base" ] || continue
            if [ -f "$base/bin/gufa-float-macos-universal" ]; then
              cp "$base/bin/gufa-float-macos-universal" desktop/float/bin/gufa-float-macos-universal
            fi
            if [ -d "$base/古法编程悬浮层.app" ]; then
              cp -R "$base/古法编程悬浮层.app" desktop/float/古法编程悬浮层.app
            fi
          done
          git status --porcelain
      - name: Commit and push branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A desktop/float/bin
          if git diff --cached --quiet; then
            echo 'no binary changes'
            exit 0
          fi
          git commit -m 'CI: update float helper binaries [skip ci]'
          git push origin HEAD:build/float-binaries --force

  package-check:
    name: npm package contents (three-platform helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check npm tarball contains all helpers
        run: |
          npm install --no-audit --no-fund
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'desktop/float/bin/gufa-float-macos-universal' /tmp/pack.txt
          grep -q 'desktop/float/bin/win-x64/gufa-float-win.exe' /tmp/pack.txt
          grep -q 'desktop/float/bin/linux-x64/gufa-float-linux' /tmp/pack.txt
          echo 'three-platform helpers present in npm tarball'

  release-assets:
    name: Attach binaries to release
    if: github.event_name == 'release'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package assets
        run: |
          cd artifacts
          zip -r gufa-float-win-x64.zip gufa-float-win-x64 || true
          tar -czf gufa-float-linux-x64.tar.gz gufa-float-linux-x64 || true
          tar -czf gufa-float-macos.tar.gz gufa-float-macos || true
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gufa-float-win-x64.zip
            artifacts/gufa-float-linux-x64.tar.gz
            artifacts/gufa-float-macos.tar.gz
