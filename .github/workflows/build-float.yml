name: build-float-helper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/float/**'
      - '.github/workflows/build-float.yml'
  pull_request:
    paths:
      - 'desktop/float/**'
  release:
    types: [published]

jobs:
  macos:
    name: macOS universal helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build universal (arm64 + x86_64)
        run: ./scripts/build-float-macos.sh
      - name: Smoke test (list windows)
        run: |
          ./desktop/float/bin/gufa-float-macos-universal --list-windows --out /tmp/win.json
          head -c 200 /tmp/win.json
          lipo -archs desktop/float/bin/gufa-float-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: gufa-float-macos
          path: |
            desktop/float/bin/gufa-float-macos-universal
            desktop/float/古法编程悬浮层.app

  windows:
    name: Windows helper (Win32 + WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          $ver = '1.0.2903.40'
          $zip = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$ver" -OutFile $zip
          $dir = Join-Path $env:RUNNER_TEMP 'webview2'
          Expand-Archive $zip -DestinationPath $dir -Force
          "WEBVIEW2_SDK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure (CMake)
        shell: pwsh
        run: |
          if (!(Test-Path desktop/float/win/CMakeLists.txt)) { Write-Error 'desktop/float/win/CMakeLists.txt missing'; exit 1 }
          cmake -S desktop/float/win -B build-win -A x64 -DWEBVIEW2_SDK_DIR="$env:WEBVIEW2_SDK_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build-win --config Release
      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/float/bin/win-x64 | Out-Null
          $exe = Get-ChildItem -Path build-win -Recurse -Filter *.exe | Where-Object { $_.Name -notlike 'vc_redist*' } | Select-Object -First 1
          if ($exe -eq $null) { Write-Error 'built exe not found'; exit 1 }
          Copy-Item $exe.FullName desktop/float/bin/win-x64/gufa-float-win.exe -Force
          Get-Item desktop/float/bin/win-x64/gufa-float-win.exe | Select-Object Length
      - name: Smoke test (ciProbe + local HTTP page)
        shell: pwsh
        run: |
          $www = Join-Path $env:TEMP 'gufa-probe-www'
          New-Item -ItemType Directory -Force $www | Out-Null
          '<html><body>gufa-probe</body></html>' | Set-Content (Join-Path $www 'index.html') -Encoding UTF8
          $http = Start-Process -FilePath 'python' -ArgumentList @('-m','http.server','8799','--bind','127.0.0.1') -WorkingDirectory $www -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $probe = Join-Path $env:TEMP 'gufa-win-probe.json'
          Remove-Item $probe -ErrorAction SilentlyContinue
          $payload = (@{ appUrl='http://127.0.0.1:8799/'; authUrl='http://127.0.0.1:8799/'; ciProbe=$true; ciProbeOut=$probe } | ConvertTo-Json -Compress)
          $process = Start-Process -FilePath 'desktop\float\bin\win-x64\gufa-float-win.exe' -ArgumentList $payload -PassThru -WindowStyle Hidden
          $process | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 40 -and -not (Test-Path $probe); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $probe) { Get-Content $probe }
          Stop-Process -Id $http.Id -ErrorAction SilentlyContinue
          if (-not (Select-String -Path $probe -Pattern '"ok":true' -Quiet)) { throw 'ciProbe did not report ok:true' }
      - uses: actions/upload-artifact@v4
        with:
          name: gufa-float-win-x64
          path: desktop/float/bin/win-x64/gufa-float-win.exe

  linux:
    name: Linux helper (X11 + GTK/WebKit2GTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb wmctrl xdotool
      - name: Build
        working-directory: desktop/float/linux
        run: make -j"$(nproc)"
      - name: Stage binary
        run: |
          mkdir -p desktop/float/bin/linux-x64
          cp desktop/float/linux/gufa-float-linux desktop/float/bin/linux-x64/gufa-float-linux
          file desktop/float/bin/linux-x64/gufa-float-linux
      - name: Smoke test (ciProbe + local HTTP page under Xvfb)
        run: |
          mkdir -p /tmp/gufa-probe-www
          printf '<html><body>gufa-probe</body></html>' > /tmp/gufa-probe-www/index.html
          (cd /tmp/gufa-probe-www && python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/gufa-probe-http.log 2>&1 &)
          sleep 1
          PROBE=/tmp/gufa-linux-probe.json
          rm -f "$PROBE"
          timeout 40 xvfb-run -a ./desktop/float/bin/linux-x64/gufa-float-linux "{\"appUrl\":\"http://127.0.0.1:8799/\",\"authUrl\":\"http://127.0.0.1:8799/\",\"ciProbe\":true,\"ciProbeOut\":\"$PROBE\"}" || true
          for i in $(seq 1 40); do [ -s "$PROBE" ] && break; sleep 0.5; done
          cat "$PROBE" 2>/dev/null || true
          grep -q '"ok":true' "$PROBE"
      - uses: actions/upload-artifact@v4
        with:
          name: gufa-float-linux-x64
          path: desktop/float/bin/linux-x64/gufa-float-linux

  package-binaries:
    name: Commit helper binaries to build/float-binaries
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage binaries
        run: |
          set -e
          mkdir -p desktop/float/bin/win-x64 desktop/float/bin/linux-x64
          find artifacts -type f | head -50
          if [ -f artifacts/gufa-float-win-x64/gufa-float-win.exe ]; then
            cp artifacts/gufa-float-win-x64/gufa-float-win.exe desktop/float/bin/win-x64/gufa-float-win.exe
          fi
          if [ -f artifacts/gufa-float-linux-x64/gufa-float-linux ]; then
            cp artifacts/gufa-float-linux-x64/gufa-float-linux desktop/float/bin/linux-x64/gufa-float-linux
            chmod +x desktop/float/bin/linux-x64/gufa-float-linux
          fi
          # macOS artifact 保留了上传时的相对路径（desktop/float/...），显式搬运，避免出现 bin/bin 嵌套
          for base in artifacts/gufa-float-macos/desktop/float artifacts/gufa-float-macos; do
            [ -d "$base" ] || continue
            if [ -f "$base/bin/gufa-float-macos-universal" ]; then
              cp "$base/bin/gufa-float-macos-universal" desktop/float/bin/gufa-float-macos-universal
            fi
            if [ -d "$base/古法编程悬浮层.app" ]; then
              cp -R "$base/古法编程悬浮层.app" desktop/float/古法编程悬浮层.app
            fi
          done
          git status --porcelain
      - name: Commit and push branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A desktop/float/bin
          if git diff --cached --quiet; then
            echo 'no binary changes'
            exit 0
          fi
          git commit -m 'CI: update float helper binaries [skip ci]'
          git push origin HEAD:build/float-binaries --force

  release-assets:
    name: Attach binaries to release
    if: github.event_name == 'release'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package assets
        run: |
          cd artifacts
          zip -r gufa-float-win-x64.zip gufa-float-win-x64 || true
          tar -czf gufa-float-linux-x64.tar.gz gufa-float-linux-x64 || true
          tar -czf gufa-float-macos.tar.gz gufa-float-macos || true
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gufa-float-win-x64.zip
            artifacts/gufa-float-linux-x64.tar.gz
            artifacts/gufa-float-macos.tar.gz
